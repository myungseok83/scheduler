     시험 스케줄 관리 시스템 V1.71.0 (🔗 연계 시험 그룹 1단계 — 배광→진동→배광처럼 순서가 이어지는 시험들을 사후에 그룹으로 묶는 기능. 관리자 패널에 "🔗 연계 시험" 탭 신설 — 그룹 목록/새 그룹 만들기, 전용 모달(modal-sequence-editor)에서 제목 검색으로 시험을 찾아 추가하고 순서(▲▼)·최대간격(일, 기본 2)을 지정해 저장. 앱/마스터 일정을 섞어서 묶을 수 있도록 각 멤버는 memberKey로 식별(앱='app:'+id, 마스터='master:'+eqId+rawContent 안정키, GAS V1.33.0의 buildSequenceMemberKey). 새 시트 'SequenceGroups'(그룹메타)/'SequenceMembers'(소속·순서), 새 액션 saveSequenceGroup(생성·수정 겸용)/deleteSequenceGroup. readAll()이 각 일정에 sequenceGroupId/sequenceOrder를 붙여 반환, 클라이언트는 이 필드로만 그룹 조회(별도 키 재계산 불필요). 일정 상세 모달에 소속 그룹이 있으면 전체 순서를 안내하는 읽기 전용 박스 표시. ⚠️ 이번 1단계는 그룹으로 묶고 조회만 가능 — 날짜 변경 시 연쇄 재배치(2단계: 명확한 조작에서 자동 발동, 3단계: 드래그·밀어내기까지 전체 적용, 필요 시 해당 장비 밀어내기 자동 연동)는 아직 구현 안 됨, 다음 요청 시 이어서 진행.)

     시험 스케줄 관리 시스템 V1.69.0 (🎯🌙 배광UNIT 24시간(주간12h+야간12h) 실제 가동 모델 도입 — 원래 하루 12시간 소프트 상한만 있던 것을, 실제로는 24시간 근무체계(주간=일반 의뢰건 계획, 야간=양산품 정기시험 배경가동, capa 부족 시 야간 자리에 의뢰건 대체 편성)라는 운영 방식을 반영. 판단 기준을 사람이 매번 정하기보다, 밀어내기 모달에 이미 있던 소요시간 규칙(명시값 우선, 없으면 품목/기간 추정치)을 당기기·재일정 수립에도 그대로 재사용하고, 빈 자리 탐색을 2단계로 변경 — findReflowEmptySlots가 배광UNIT이면 ① 주간(12h) 안에서만 먼저 찾고 ② 하나도 없을 때만 야간 포함 24h로 재탐색(findBeamUnitEmptySlots 신설), 결과에 isNight 플래그를 달아 당기기/재일정 수립 슬롯 선택 화면에 🌙 배지로 표시. 이동/생성 확정 시 이때 쓴 소요시간을 dailyHours 명시값으로 확정 저장(앱 saveSchedule / 마스터 setMasterHours). 밀어내기 모달의 배광UNIT 전용 캐스케이드(computeReflowCascadeBeamUnit)도 동일하게 findNextFit을 2단계(주간→야간)로, ensureDayFits의 판정 기준을 12h→24h(BEAM_UNIT_HARD_CAPACITY)로 변경. 일정 등록/수정 모달의 저장 시 용량 경고(checkBeamUnitCapacityViolation)도 12h 초과가 아니라 24h(물리적 한계) 초과일 때만 뜨도록 완화 — 12~24h 구간은 야간 대체 편성으로 보고 마찰 없이 그냥 저장됨. 다만 "어떤 기존 항목이 이미 야간에 배정된 것인지"를 과거 데이터에서 자동으로 역추정하는 기능(캘린더/타임라인 막대의 상시 🌙 배지)은 판단 기준이 인위적일 수밖에 없어 이번 범위에서는 보류 — 이 도구들을 통해 새로 배치되는 항목만 그 순간에 확실히 알 수 있으므로 그 경우에만 표시.)
     시험 스케줄 관리 시스템 V1.68.0 (⏪ 당기기/단축 호버 버튼이 이미 시작일이 지난(오늘 이하) 일정에도 떠서 눌러도 "더 당길 수 없습니다" 토스트만 뜨던 문제 수정 — isPullEligible에 시작일이 오늘보다 미래인 경우만 조건 추가. 이미 지난 일정은 당길 데가 없으니 애초에 버튼이 안 뜨고, 같은 항목이 미입고/검증지연 상태라 재일정이 필요하면 "📅 재일정 수립" 버튼은 그대로 뜸(당기기와 별개 조건).)
     시험 스케줄 관리 시스템 V1.67.0 (🔁 미입고/검증지연 항목 "재일정 수립" 기능 추가 — 기존 "⏪ 당기기"(오늘~현재 시작일 사이의 빈 자리, 과거 방향)와 반대로 오늘 이후 미래(60일 이내)에서 빈 자리를 찾는 전용 호버 버튼 "📅 재일정 수립"을 계획막대 상태 팝오버에 추가(isRescheduleEligible = 관리자+isScheduleDelayed+!rescheduled). 원본 시트의 미입고 상태는 절대 건드리지 않는다는 요구사항에 맞춰, 기존 항목을 "이동"시키지 않고 같은 제목/장비로 새 일정을 별도 생성(saveSchedule)한 뒤, 원래 항목에는 "재일정 수립됨" 표시만 남김 — 앱 등록 일정은 Schedules 시트 'rescheduled' 컬럼에, 🔒 마스터 일정은 안정 키(eqId+rawContent) 기반 별도 시트 'MasterReschedule'에 저장(GAS V1.31.0, setMasterReschedule 액션). 표시가 남으면 ⚠️ 배지는 그대로 유지(원본 상태 그대로이므로)하되, 계획막대의 빨간 점선 강조(needsReschedule = isScheduleDelayed && !rescheduled)만 사라져 "이미 재일정 잡음"을 구분. 빈 자리가 없으면 밀어내기 후보 추천(신규 등록 모드, 차종/품목 자동 파싱해 미리 채움)으로 자동 연결.)
     시험 스케줄 관리 시스템 V1.66.0 (🎯 배광UNIT 소요시간 추정치를 placeholder가 아니라 입력칸 실제 값으로 자동 채우도록 변경 — schBeamHoursAutoFilled 플래그로 자동채움 상태를 추적, 사용자가 직접 값을 고치면(oninput) 그 뒤로는 자동 재계산이 덮어쓰지 않고, 명시적으로 저장된 값이 있는 수정 모달에서도 자동채움이 덮어쓰지 않음. 항목명/시작일/기간 변경 시에도 실시간으로 추정치 재계산(oninput/onchange 추가). 🔗 "시험계획표에도 반영" 체크박스 제거 — 일정 등록 모달(sch-push-appinput)과 자동계획 수립 모달(auto-push-appinput) 둘 다에서 체크박스를 없애고 기본 동작(항상 반영)으로 고정.)
     시험 스케줄 관리 시스템 V1.65.0 (🛡️ 중요 품목 접두어 목록(IMPORTANT_ITEM_PREFIXES)에 'DPT' 추가 — 기존 HL/RCI/RCO/RCL/F_FOG에 이어 6개로 확장. isImportantItem을 그대로 공유하는 두 곳(🔀 밀어내기 보호 등급 A/B/C 판정, 🎯 배광UNIT 소요시간 미입력 항목의 추정치)에 동시에 반영됨.)
     시험 스케줄 관리 시스템 V1.64.0 (🎯 배광UNIT(배광1호/2호) 하루 12시간 용량 기반 밀어내기/일정등록 지원 — 원본 시트가 배광UNIT을 "우선순위 1~4호" 병렬 슬롯으로 관리해 하루에 여러 건이 동시에 진행되는데(하루 12시간 가용), 앱의 밀어내기·자동계획 로직은 겹침=무조건 불가로 오판해 사소한 조정 하나가 몇십 건씩 연쇄로 밀리는 버그가 있었음(구글드라이브 연동으로 원본 시트를 직접 열어 확인). 데이터 모델: 일정에 'dailyHours'(하루 소요시간) 필드 추가 — 앱 등록 일정은 Schedules 시트 컬럼에, 🔒 마스터 일정은 안정 키(eqId+rawContent) 기반 별도 시트 'MasterHours'에 저장(GAS V1.30.0, setMasterHours 액션). 소요시간 미입력 레거시 항목은 품목 중요도(HL/RCL/RCI/RCO/F_FOG, isImportantItem 재사용)와 마지막날 여부로 정해지는 고정 추정치를 사용(1일짜리 또는 마지막날 아닌 날: 중요품목 12시간/그 외 5시간, 2일 이상 계획의 마지막날: 중요품목 7시간/그 외 4시간) — estimateDailyHoursOnDate. 일정 등록/수정 모달에 배광UNIT 선택 시에만 "하루 소요시간" 입력칸 노출(필수, placeholder로 추정치 안내), 저장 시 하루 총 사용시간이 12시간을 넘으면 경고 모달(그래도 저장 가능). 밀어내기 모달도 배광UNIT 대상이면 같은 입력칸이 뜨고, 겹침 기반 커서 캐스케이드(computeReflowCascade) 대신 날짜별 용량 초과 여부만 확인해 필요한 경우에만(원래 시작일이 가장 늦은 항목부터) 옮기는 전용 계산(computeReflowCascadeBeamUnit)으로 분기. 자동계획 수립은 이번 범위에서 제외(추후 별도 진행). isEquipmentFreeRange도 배광UNIT이면 후보 소요시간을 받아 용량 기준으로 판정하도록 확장(다른 장비는 기존과 동일, 넘기지 않으면 기존처럼 종일 점유로 엄격 판정).)
     시험 스케줄 관리 시스템 V1.62.0 (🔀 밀어내기 결과 화면 재정리 — ① 미니 간트 미리보기를 더 크게(dayWidth 20→30, 행 높이 30→38, 표시영역 최대높이 220→400px, 막대에 항목명 라벨 표시) 키우고 모달 폭도 max-w-lg→max-w-3xl로 확장. ② 건별 체크박스로 반영 여부를 고르던 텍스트 목록을 없애고, 문제없는 항목은 전부 자동 반영되도록 변경 — 지그 충돌 항목만 사유 입력을 필수로 요구(기존과 동일), 보호대상 과다밀림(D+4일 초과) 항목은 경고만 표시하고 입력은 불필요. 근접/원거리(reflow-far) 구분과 그 토글 UI 전체 제거, 상단에 "확인이 필요한 N건(나머지는 자동 반영)" 요약 문구만 남기고 문제 있는 항목만 카드로 나열. confirmReflowBatch도 체크박스 대신 reflowState.changes 전체를 반영 대상으로 처리하도록 수정.)

     시험 스케줄 관리 시스템 V1.60.0 (📝 메모/회의록 서식 사용성 개선 4건 — ① 서식/표 패널(details)이 버튼 클릭 후에도 안 닫히던 문제 수정: 패널 안 버튼(색상 스와치 포함)·색상선택·드롭다운 확정 시 자동으로 닫히도록 위임 리스너 추가(행/열 개수 숫자입력은 계속 입력해야 하므로 제외). ② 정렬 버튼 라벨 '왼/중/우' → 'L/C/R'로 변경(B/I/U/S와 통일된 스타일). ③④ 표 셀 다중 선택(병합/분할/음영에 공용) 로직을 전면 교체 — 기존엔 브라우저가 contenteditable 안에서 만들어주는 다중 Range(Selection.rangeCount>1)에 의존했는데 이게 특히 위/아래로 행을 넘는 드래그에서 잘 안 만들어져 병합·분할·음영 모두 실패하는 경우가 많았음. 이제 mousedown(시작 셀)→mousemove(지나는 셀)로 사각형 범위를 직접 계산해 선택하는 자체 로직으로 교체(memoSelectedCells, memo-cell-selected 클래스로 시각 표시), getMemoDragSelectedCells가 이 상태를 반환하도록 변경 — memoRte/memoSetCellShading/memoTableMergeCells가 이 함수를 그대로 재사용하므로 서식 적용까지 한 번에 함께 고쳐짐. 병합/분할 후에는 없어진 셀 참조가 안 남도록 선택 상태를 정리.)

     시험 스케줄 관리 시스템 V1.57.0 (🔧 장비 고장/정비를 "고장(설비사용 불가)"/"보수(일부 조건 사용 가능)" 두 유형으로 분리 — 등록 모달에서 라디오로 선택, id 접두어로 구분(고장=maint_, 보수=repair_), 제목 이모지도 다르게(🔴/🟠) 자동 부여. 색상도 구분(고장=진한 회색 bg-slate-800 유지, 보수=주황 bg-amber-600). ★ 핵심 동작 변경: 보수 기간은 "정상적인 계획수립"이 가능하도록 점유로 치지 않게 처리 — 자동계획 수립(isEquipmentFreeRange/isEquipmentAvailableForCandidate)과 밀어내기·당기기 빈자리 탐색(findReflowEmptySlots)·밀어내기 시뮬레이션의 빈자리 판정(runReflowSimulation의 eqSchedules)에서 모두 보수 레코드를 제외해, 같은 장비에 다른 시험이 겹쳐 등록될 수 있음(고장은 기존처럼 완전히 막힘, 변경 없음). '오늘의 장비 가동현황' 위젯도 보수는 "🟠 보수중(부분가능)"으로 표시하고 같은 날 겹쳐 진행 중인 시험이 있으면 함께 노출(고장은 기존처럼 "🔴 고장중" 단독 표시). GAS 변경 불필요(V1.55.0과 동일하게 saveSchedule 재사용, id 접두어만 다름).)
     시험 스케줄 관리 시스템 V1.56.0 (🛡️ "밀리면 안 됨(보호)" 범용 필드 추가 — 신규/수정 모달(휴일·근태·고장정비 제외 모든 일정, 마스터 포함)에 체크박스+사유 노출. 앱 등록 일정은 Schedules 시트 protected/protectReason 컬럼에, 마스터 일정은 별도 시트에 eqId+원본 셀 내용 정규화 키로 저장(GAS V1.29.0 setMasterProtection). 🔀 밀어내기 후보 추천에 우선순위 등급(A=중요품목 HL/RCI/RCO/RCL/F_FOG+보호 둘다, B=둘 중 하나, C=해당없음) 도입 — 밀림이 D+4일 이내면 등급 무관하게 그대로 반영하고, 그 초과인데 등급 A/B면 findReflowSwapAlternative를 'protect' 모드로 확장해 등급 C 일정이 대신 밀리는 순서교체 대안을 제시(강제 아님, 대안 없으면 경고만 표시). 이 로직은 지그 충돌 대안 탐색과 프레임을 공유하며 신규/기존 조정 양쪽 모드에 동일 적용됨.)
     시험 스케줄 관리 시스템 V1.29.0 (관리자 외 회원: 자동계획 수립/마스터 반영 중복 정리/메모 회의록/휴일 등록 메뉴 숨김) (V1.27.0: 좌측 패널 근태 등록 추가 — 뷰어 권한자도 본인 근태 편집 가능, 캘린더/타임라인 배광1호 위에 근태 표시) (V1.27.1: 달의 마지막 날/주의 마지막 칸에 시작하는 일정이 타임라인·캘린더에서 안 보이던 타임존 버그 수정) (V1.27.2: 모바일 공간 확보를 위해 타임라인뷰 상단 안내 문구 제거) (V1.28.0: 일정 상세 모달에 '결과 리뷰' 자유 텍스트 항목 추가) (V1.29.0: 수동 일정입력 시 환경UNIT 제외 장비의 주말/공휴일 포함 여부를 검증하여 경고 후 사용자가 저장여부 선택 가능하도록 개선) (V1.30.0: 관리자 전용 '🔀 밀어내기 후보 추천' 기능 추가 — ① 신규/지연 건이 자리가 없을 때 기존 일정을 순서대로 밀어내는 시뮬레이션과 변경 전/후 비교, ② 이미 계획된 일정 중 예정일이 너무 늦다는 요구로 당기거나(앞당기기) 기간을 단축해야 할 때도 같은 방식으로 뒤 일정을 밀어내는 시뮬레이션 지원(모드 전환). 지그 충돌 시 인접 일정과 순서를 바꿔보는 대안을 자동 탐색해 제안하며, 자동연동(마스터) 일정은 고정된 장애물로 처리해 밀 수 없음을 명확히 알림. 밀리거나 당겨지는 일정은 원래 차지하던 실제 시험일수(근무일)를 유지하도록 주말/공휴일을 감안해 새 위치의 달력기간을 재계산함(자동계획 수립과 동일 규칙: 환경UNIT 예외, 습기UNIT 전체구간 무휴일, 그 외 장비는 시험일수 기준 종료일 산정). 일괄 반영/되돌리기 이력 관리(기간 변경도 함께 원복)) (V1.31.0: 관리자 전용 — 캘린더뷰·타임라인뷰의 계획 막대에 마우스오버하면 '⏪ 당기기/단축' 단축 아이콘이 뜸. 클릭하면 오늘~현재 시작일 사이의 빈 자리(시험일수·지그 기준 검증됨)를 바로 골라 이동할 수 있고, 빈 자리가 없으면 자동으로 '🔀 밀어내기 후보 추천' 모달이 해당 일정이 선택된 상태로 열림) (V1.32.0: 🔒 업무현황 자동연동(마스터) 일정 양방향 동기화 — 편집 권한자는 마스터 일정도 편집 가능해지며, 저장 시 앱 자체 Schedules 시트가 아니라 원본 '시험계획표' 월별 탭 셀에 직접 반영됨(서버의 새 updateMasterSchedule 액션 필요, 별도 GAS 코드 참고). 내용만 수정한 경우 기존 셀의 음영은 유지, 날짜/기간/장비가 바뀌어 자리를 옮긴 경우에는 기존 셀을 비우고 새 위치에 앱 반영 표시용 고정 색상(인디고 계열, #c7d2fe)을 입힘) (V1.33.0: 🔒 마스터 일정에도 호버 단축 팝오버(진행상태 변경/당기기) 개방 — ① 진행상태는 '완료'/'진행' 두 가지만 지원(원본시트 파이프라인이 진행결과 칸에 '완료' 또는 공란만 인식하므로 '지연' 버튼은 마스터 항목에서 숨김, 서버의 새 updateMasterProgressStatus 액션이 월별 탭 진행결과 셀에 직접 반영), ② '당기기/단축'은 updateMasterSchedule 경로로 원본 셀에 반영(관리자 전용, 기존 권한 범위 동일). 추가로 타임라인뷰 막대 라벨을 마스터 일정에 한해 영문 추출 대신 제목(첫 줄) 전체로 표시.) (V1.34.0: 타임라인뷰 막대 라벨을 앱 등록 일정도 마스터와 동일하게 제목(첫 줄) 전체로 표시(영문 추출 방식 폐지). 앱에서 등록한 일정을 원본 '시험계획표' 월별 탭에 반영(pushToAppInput)할 때도 마스터 항목처럼 배경색을 입히되, 고정색이 아니라 항목마다 랜덤한(가독성 있는 밝기·채도 범위 내) 색상을 적용(서버 randomVisibleColor 참고).) (V1.35.0: ① 전체 일정/메모 모달의 세로 스크롤이 둥근 테두리를 뚫고 보이던 렌더링 버그 수정(헤더 고정 + 내부 스크롤 영역 분리). ② 메모/회의록 내용 입력을 리치텍스트로 전면 교체 — 굵게/밑줄/글자색/서식지우기, 표 삽입 및 행·열 추가삭제·표 전체삭제 지원. ③ 사이드 필터의 '장비'를 단일 선택에서 다중 선택 체크리스트로 전환. ④ '📊 대시보드' 뷰 신규 추가 — Chart.js 기반으로 연도별/월별 계획건수 추이, 시험기별·차종별·품목별(TOP10) 계획건수, 진행상태 분포(완료율·변경건수 포함 KPI 카드)를 좌측 필터와 연동해 시각화.) (V1.35.1: 🔒 마스터 일정 저장/당기기 시 서버(GAS V1.21.0)가 원본 시트에서 기존 셀을 못 찾아 못 지운 경우 warning을 반환하도록 바뀐 것에 맞춰, 그 warning을 토스트로 노출하도록 수정. 이 클라이언트 변경은 GAS 쪽도 V1.21.0(원본 셀 매칭 시 줄바꿈/공백 정규화 + 실패 시 warning 반환)으로 함께 올려야 의미가 있음.) (V1.36.0: 🔀 밀어내기 후보 추천에서 🔒 자동연동(마스터) 일정도 조정 대상으로 포함 — V1.32.0에서 마스터 일정 자체 편집은 이미 가능해졌으나 이 기능만 여전히 "고정된 장애물"로 취급해 막고 있던 것을 수정. 대상 선택 드롭다운에서 마스터 일정 비활성화(disabled) 해제, 밀림 연쇄 계산(computeReflowCascade)에서 마스터 일정도 일반 일정과 동일한 근무일 규칙으로 새 위치를 재계산, 지그 충돌 시 순서 교체 대안(findReflowSwapAlternative)에서도 마스터 일정을 파트너 후보로 포함. 결과 화면에 🔒 표시로 마스터 일정임을 구분하고, 일괄 반영/되돌리기 시 마스터 항목은 saveSchedule이 아니라 updateMasterSchedule 경로로 원본 '시험계획표' 시트에 직접 반영(반영 후 셀 위치가 바뀔 수 있어 전체 재로딩으로 동기화). GAS 코드 변경 불필요(기존 updateMasterSchedule 액션 재사용).) (V1.37.0: ① 좌측 '보기' 메뉴 순서를 대시보드가 최상단에 오도록 변경. ② 다크모드 지원 — 헤더의 스위치로 라이트/다크 전환, 선택값은 localStorage에 저장되어 다음 접속 시에도 유지되며 대시보드 차트(Chart.js) 텍스트·그리드 색상도 함께 갱신. ③ 대시보드 상단 필터를 '월별 차트 기준 연도' 단일 선택에서 '년도'/'월' 2가지 선택으로 분리 — 두 필터 모두 KPI 카드와 모든 차트에 공통 반영(각각 '전체' 선택 가능). ④ 테이블뷰 스케줄 목록의 원형 아이콘 표시를 제목 맨 앞의 이모지·괄호·기호 등 특수문자를 건너뛰고 첫 번째 글자(문자/숫자)를 표시하도록 수정.) (V1.37.1: 다크모드에서 그룹/장비/검색 필터와 대시보드 년도·월 선택란의 글자가 안 보이던 문제 수정 — 해당 요소들이 쓰는 Tailwind '!bg-slate-50'/'!bg-white'(!important) 배경 유틸리티를 다크모드 전용 규칙으로 별도 재정의하고, 입력란 글자색·placeholder 색상도 강제 적용. 브라우저 기본 폼 컨트롤이 다크로 렌더링되도록 color-scheme:dark 힌트도 추가.) (V1.37.2: 타임라인뷰 다크모드에서 근태행(bg-emerald-50/50)·오늘 날짜 컬럼(bg-indigo-100/60) 음영이 연한 파스텔+투명도 조합 때문에 탁한 회색으로 보이던 문제 수정 — 채도가 살아있는 진한 톤으로 재정의.) (V1.38.0: 로그인/메인 화면 헤더의 🧪 이모지+인디고 박스 로고를 사용자가 제공한 'OMS' 브랜드 로고 이미지로 교체(이미지를 base64로 파일 내부에 내장해 외부 호스팅 없이 동작). 브라우저 탭 파비콘도 동일 로고의 원형 엠블럼 부분을 정사각형으로 잘라 함께 적용.) (V1.38.1: 다크모드에서 메모/회의록 카드(bg-amber-50)와 앰버·오렌지 계열 배지/테두리가 흙빛 갈색으로 탁하게 보이던 문제 수정 — 앰버·오렌지는 파란기가 거의 없는 색이라 반투명으로 어두운 남색 배경과 섞이면 갈색으로 탁해지는 것을 확인, 반투명 블렌딩 대신 미리 정한 짙은 앰버 톤(플랫 컬러)으로 대체.) (V1.38.2: 위와 같은 원인(연한 파스텔 색상에 opacity를 섞은 클래스)의 누락 사례 전수 점검 — 근태 등록 패널(bg-emerald-50/60), 근태 안내문구(text-emerald-700/70), 메모 이미지 첨부 영역의 hover/focus 앰버 강조(bg-amber-50/50, border-amber-300/400), 캘린더·타임라인의 공휴일 배지(bg-white/80)까지 다크모드 전용 색상으로 보정. 반대로 bg-indigo-600/emerald-600/rose-500 등 원색 그대로인 버튼·범례 색상은 다크모드에서도 잘 보여 그대로 유지.) (V1.39.0: 원본 '시험계획표'에 101~102행으로 추가된 '기타' 2건(장비번호 1/2호로 구분)을 앱에서도 별도 레인으로 관리하도록 장비 목록에 '기타 1호'(etc_1, 기존 'etc_1'을 개명)/'기타 2호'(etc_2, 신규) 등록. ⚠️ 이 항목이 실제로 뜨려면 GAS 쪽도 함께 수정해야 함 — ① '시험계획표' 파일의 집계 스크립트(copyAndPasteWithMergedCellsOptimized)가 100행까지만 읽던 것을 101~102행까지 읽도록 확장, ② 웹앱 백엔드(GAS)의 getMonthlyTabCache가 조회하는 B13:B100/C13:C100 범위를 B13:B105/C13:C105로 확장(당기기·마스터 일정 수정 등 원본 셀 되쓰기 기능용), ③ EQUIPMENT_NAME_PREFIX_MAP에 'etc_':'기타' 역매핑 추가(앱에서 등록한 기타 일정을 원본 시트에 반영하는 pushToAppInput용). 자세한 코드는 대화 참고 — 기존 '내충격' 항목은 그대로 '기타 1호'(etc_1) 레인을 함께 사용함(의도적으로 유지, 분리 원하면 추가 협의 필요).) (V1.39.1: 타임라인뷰에서 근태행의 좌측 고정 라벨("🗓️ 근태") 뒤로 스크롤되는 근태 막대(예: 연차 등)가 비쳐 보이며 마치 왼쪽 기준열을 뚫고 나오는 것처럼 보이던 문제 수정. 원인은 V1.37.2에서 근태행 배경(bg-emerald-50/50)을 고치면서 근태 라벨이 쓰는 bg-emerald-50도 함께 반투명(rgba)으로 바뀌어, 좌측 고정 라벨이 원래 해야 할 '뒤쪽 스크롤 내용 가리기' 역할을 못 하게 된 것 — 근태 라벨 전용 클래스를 추가해 다크모드에서 불투명한 배경을 갖도록 수정.) (V1.39.2: 헤더 로고 이미지가 좌우 중앙에 맞지 않고 왼쪽으로 쏠려 보이던 문제 수정 — 원본 로고의 반짝이 장식이 본체(날개+원형 엠블럼)에서 멀리 떨어진 오른쪽 끝에만 있어서, 이를 포함해 crop하다 보니 여백이 좌우 비대칭이 됐던 것. 반짝이를 제외하고 날개+엠블럼 마크 기준으로 좌우 대칭 크롭해 재적용.) (V1.40.0: 🔔 메모/회의록 리마인드 — 메모 저장 시 본문에서 날짜로 보이는 표현(예: 9/20, 9.20, 9-20, 9월20일, 연도 포함 날짜)을 자동으로 인식해 리마인드 후보로 제시하고, 저장 전 칩 형태로 확인/제거 가능(오탐 방지, 단독 날짜도 인식하므로 필요 없는 건 직접 제거). 해당 날짜가 되면(오늘 이하로 지나면) 앱 접속 시 상단 배너로 알림, 캘린더·타임라인 해당 날짜 칸에도 🔔(예정은 반투명) 표시 — 클릭 시 해당 메모로 바로 이동. '확인함' 버튼으로 리마인드를 완료 처리(메모 자체를 삭제하면 리마인드도 함께 삭제됨). 별도 시간 트리거 없이 앱 접속/탭 재포커스 시점에만 확인(GAS 쪽도 V1.26.0으로 함께 반영 필요 — memosSheet reminderDates/reminderDone 컬럼, getActiveReminders/markReminderDone 액션).) (V1.40.1: 메모/회의록 모달에서 표처럼 넓은 콘텐츠가 카드 바깥으로 삐져나오던 문제 수정 — 스크롤 영역 div가 flex 자식일 때 기본 min-width:auto 때문에 표의 실제 폭만큼 카드 자체가 넓어지던 것이 원인. 해당 div에 min-w-0 추가, memo-rich-content에 overflow-x:auto 추가해 넓은 표는 그 안에서만 가로 스크롤되도록 수정.) (V1.40.2: 타임라인 좌우 스크롤 시 버벅이며 점프하던 문제 수정 — 상단 보조 스크롤바/본문 스크롤 두 요소를 서로 동기화할 때 매 scroll 이벤트마다 즉시 scrollLeft를 써주던 것을, requestAnimationFrame으로 프레임당 1회만 반영하도록 배치 처리해 트랙패드 관성 스크롤 중 강제 레이아웃 반복을 없앰.) (V1.40.3: 타임라인뷰 계획 막대 드래그 이동/기간조정을 🔒 업무현황 자동연동(마스터) 일정에도 허용 — 기존에는 일반(앱 등록) 일정만 드래그 가능했고 마스터는 attachBarDragHandlers에서 명시적으로 제외되어 있었음. 드롭 시 확인 팝업(지그 충돌 검사 포함, 기존 로직 그대로)까지는 동일하게 거치되, 실제 저장은 마스터 일정 편집 모달(saveScheduleFromModal)과 동일하게 saveSchedule 대신 updateMasterSchedule 경로로 분기해 원본 '시험계획표'에 직접 반영하고 전체 재로딩. 캘린더뷰는 이번 범위에서 제외(추후 별도 진행).) (V1.40.4: 리마인드 표시 위치를 상단 배너에서 좌측 사이드패널 최상단(보기 메뉴 위)으로 이동 — 캘린더/타임라인 화면 자체를 가리지 않고, 뷰를 바꿔도 계속 보이도록 개선. 좁은 패널 폭에 맞게 카드 레이아웃도 세로형으로 조정.) (V1.40.5: 메모/회의록 리치텍스트 툴바에 글자 크기 선택(10~32px) 드롭다운 추가 — 원하는 영역을 드래그로 선택 후 크기를 고르면 적용. execCommand('fontSize')가 임의 px을 못 받는 한계를 우회하기 위해 임시 값(7)으로 적용한 뒤 생성된 font 태그를 실제 px의 span으로 치환하는 방식 사용. select는 버튼과 달리 native하게 열려야 해서 mousedown-preventDefault 트릭을 못 쓰는 대신, 선택 영역을 별도로 저장해뒀다가 크기 적용 직전 복원하는 방식으로 드롭다운 클릭 시 텍스트 선택이 풀리는 문제를 해결.) (V1.41.0: 메모/회의록 리치텍스트에 텍스트 정렬(왼쪽/가운데/오른쪽, justifyLeft/Center/Right) 버튼 추가 — 표 안 셀에서 쓰면 그 셀 기준으로 정렬됨. 표 셀 병합/분할 기능 추가: 표 안에서 여러 셀에 걸쳐 마우스로 드래그해 선택한 뒤 '병합' 버튼을 누르면 하나의 셀로 합쳐지고(브라우저가 드래그 시 셀 단위로 나눠주는 다중 Range 선택을 그대로 활용, Chrome/Edge 등에서 동작), 이미 병합된 셀에 커서를 두고 '분할' 버튼을 누르면 원래의 낱개 셀들로 되돌아감(내용은 원래 좌상단 셀에 유지). rowspan/colspan이 섞인 표도 올바르게 처리하도록 셀 좌표를 격자(grid)로 계산하는 로직을 함께 추가.) (V1.42.0: 메모/회의록 표 셀에 음영(배경색) 넣는 기능 추가 — 회색/노랑/초록/파랑/빨강 프리셋과 색상 직접 선택, '채우기없음'으로 지우기 지원. 마우스로 여러 셀을 드래그해 선택하면 그 셀 전부에, 아니면 커서가 있는 셀 하나에 적용됨(병합/분할과 셀 선택 로직 공유). 옅은 배경 위에서도 글자가 잘 보이도록 음영 적용 시 글자색을 짙은 톤으로 함께 고정.) (V1.44.0: ① 표 안 ↑/↓ 커서 이동 판정 로직 재작성 — 셀 테두리로부터의 거리로 첫/마지막 줄을 판정하던 방식이 <td> 기본 속성인 vertical-align:middle(내용이 짧으면 세로 가운데 정렬됨) 때문에 실제로는 판정이 거의 항상 실패했음. 셀 내용의 맨 처음/맨 끝 위치의 좌표와 현재 커서 좌표를 직접 비교하는 방식으로 바꿔 정확도 개선. ② 표에서 여러 셀을 드래그로 선택한 뒤 서식/음영을 적용하면 클릭(마지막 커서 위치)한 셀 하나에만 적용되던 문제 수정 — 원인은 두 가지: (a) 서식/표 버튼을 V1.43.0에서 드롭다운(요약/펼침) 그룹으로 묶으면서, 그 그룹을 여는 클릭 자체가 표에서 만들어둔 드래그 선택을 지워버리고 있었음(다른 버튼들처럼 summary에도 mousedown-preventDefault 추가로 해결). (b) 설사 선택이 유지되어도 execCommand를 여러 표 셀에 걸친 선택에 그대로 실행하면 브라우저가 셀 하나에만 적용하는 경우가 있어, 드래그로 선택된 셀 목록을 직접 얻어와 셀마다 그 내용 전체를 선택한 뒤 개별적으로 서식 명령을 실행하도록 변경(memoRte, 글자크기 select용 저장/복원 로직 모두 동일하게 수정). 셀 음영(memoSetCellShading)은 애초에 이 방식이었어서 (a)만 고치면 됨.) (V1.45.0: 관리자 전용 '🔍 마스터 정합성 검사' 기능 추가 — 기존 '🧹 마스터 반영 중복 정리'가 앱 내부(수동 등록분 vs 마스터로 읽어온 것) 중복만 잡는 것과 달리, 이건 🔒 자동연동 항목끼리 비교해서 완전히 같은 원본 셀 내용(rawContent)이 서로 다른 날짜·기간·장비 조합으로 동시에 존재하는 경우를 찾는다. '이동' 처리 중 기존 셀을 못 지운 채 새 위치에도 반영되는 유형의 버그가 남긴 흔적을 진단하기 위한 용도. 이미 로딩된 schedules 배열만으로 비교해 원본 시트에 추가 API 호출 없이 즉시 동작하며, 진단 전용이라 삭제 버튼 없이 목록만 보여줌(원본 시트는 직접 확인 후 정리 필요). GAS 변경 불필요.) (V1.46.0: 마스터 정합성 검사의 비교 범위를 '내용이 같으면 장비가 달라도 비교'에서 '같은 장비(eqId) 안에서만 비교'로 좁힘 — 실사용에서는 서로 다른 장비로 동일 목적의 시험(이 시험/저 시험)을 진행하는 경우가 흔해, 장비까지 걸쳐 비교하면 이런 정상 케이스가 대량으로 오탐 처리됐음. 이동 처리 중 기존 셀을 못 지우는 버그는 애초에 같은 장비 안에서만 발생하므로 진단 목적은 그대로 유지하면서 오탐만 제거됨. 결과 카드도 장비명을 그룹 상단에 한 번만 표시하도록 정리.) (V1.47.0: '🔍 마스터 정합성 검사' 기능 제거(V1.45.0~V1.46.0). 실제로는 원본 시트를 만드는 매크로(copyAndPasteWithMergedCellsOptimized)가 같은 장비·내용 키를 가진 레코드를 "가장 이른 시작일~가장 늦은 종료일"로 병합하는 구조라, 이 기능이 가정했던 "같은 내용의 마스터 일정이 서로 다른 날짜로 앱에 별개로 뜨는" 상황 자체가 거의 발생하지 않고, 대신 기간이 비정상적으로 길어지는 형태로 나타나 캘린더/타임라인에서 이미 시각적으로 눈에 띄기 때문에 별도 기능의 실효성이 낮다는 판단으로 제거. 버튼/모달/관련 함수(findMasterConsistencyIssues, openConsistencyCheckModal 등) 전부 삭제.) (V1.48.0: 메모/회의록에 엑셀·파워포인트 "표"를 붙여넣으면 항상 스냅샷 이미지로만 붙던 문제 수정 — 클립보드에 표 구조(HTML <table>)와 이미지가 함께 담겨오는데, 기존 붙여넣기 처리가 이미지 항목이 있으면 무조건 그걸로 처리하고 기본 붙여넣기를 막아버려서 표 HTML이 있어도 항상 이미지만 붙었음. 클립보드 HTML에 <table>이 있으면 기본 붙여넣기(표 그대로 삽입)에 맡기도록 수정하고, 붙여넣은 표에도 우리 표 편집 도구(행/열·병합/분할·음영·방향키 이동)가 동작하도록 memo-rte-table 클래스를 붙여줌. 파워포인트 "차트" 개체는 원래 표 데이터가 아니라 그림으로 복사되는 경우가 대부분이라 이 분기로 못 살리며 예전처럼 이미지로 붙음(정상 동작).) (V1.48.1: 버그수정 — V1.45.0에서 '마스터 정합성 검사' 모달을 추가하면서 바로 옆에 있던 '마스터 반영 중복 정리' 모달의 '닫기'/'선택 항목 삭제' 버튼을 실수로 함께 지워버려, 그 뒤(V1.46.0~V1.48.0) 계속 정리 실행 버튼이 안 보이던 문제 복구. 버튼을 호출하는 JS 함수(toggleAllDedupeItems/deleteSelectedDedupeItems)는 원래부터 그대로 남아 있었어서 버튼 마크업만 복원하면 되는 문제였음.) (V1.49.0: 🔒 자동연동 일정의 '지연' 표시 반영 — 원본 시트의 집계 로직(copyAndPasteWithMergedCellsOptimized)이 진행결과 '미입고'/'검증지연' 값도 이제 '시험계획누적'에 포함시키도록 바뀌었는데, 앱의 지연 배지(⚠️, 캘린더 칩 접두어·타임라인 배지·날짜별 목록)는 여전히 앱 등록 일정의 progressStatus==='지연'만 검사하고 있어 마스터 일정은 이 값들이 들어와도 지연 표시가 전혀 안 뜨던 문제 수정. 마스터/앱 등록 일정 모두를 아우르는 isScheduleDelayed() 헬퍼를 새로 추가(마스터는 status가 '미입고' 또는 '검증지연'인 경우, 앱 등록은 기존과 동일)하고, 기존 s.progressStatus==='지연' 체크를 전부 이걸로 교체. 타임라인 배지는 마스터의 경우 '⚠️ 지연' 대신 원본의 구체적 사유(⚠️ 미입고 / ⚠️ 검증지연)를 그대로 표시(getDelayBadgeText). 테이블뷰 상태 배지 색상표(statusColors)와 대시보드 색상표(DASH_STATUS_COLORS)에 '검증지연' 항목 추가, 대시보드 '변경건수' 판정(isChangedSchedule)에도 미입고/검증지연 포함. 마스터 일정의 진행상태 팝오버(완료/진행 버튼)는 기존과 동일하게 유지 — 이 두 값은 원본 시트에서만 설정 가능하며 앱에서 새로 쓰는 기능은 추가하지 않음. GAS 변경 불필요(읽기만 반영, 쓰기 검증은 기존 그대로).) (V1.50.0: 지연 배지(⚠️)가 다른 막대에 가려지는 문제 수정 — 캘린더뷰 연결막대는 z-index:2로 명시돼 있는데 배지는 z-index를 지정하지 않아(auto) CSS 스택 규칙상 양수 z-index를 가진 막대가 항상 위에 그려지고 있었음(실질적으로 늘 가려짐). 타임라인뷰는 막대 자체엔 z-index가 없지만, 배지도 z-index가 없어 DOM에 나중에 추가되는 다른(이후 날짜의) 막대가 같은 auto 레이어 순서상 위로 그려지며 가리는 경우가 있었음. 캘린더·타임라인 배지 모두에 z-index:20을 명시해 항상 막대보다 위에 그려지도록 수정. 추가로 타임라인 배지는 '⚠️ 미입고'/'⚠️ 검증지연'처럼 텍스트 길이가 들쭉날쭉해 기존 좌표 계산으로는 막대 오른쪽 끝을 넘어 다음 날짜 칸까지 삐져나가던 것을, translateX(-100%)로 배지의 오른쪽 끝이 막대 오른쪽 끝에 맞춰지도록 고쳐 텍스트 길이와 무관하게 항상 막대 안쪽에 붙게 함.) (V1.51.0: 대시보드에 '오늘의 운영 현황' 섹션 신규 추가 — 기존 대시보드가 전부 과거 누적 통계(연도별/월별/장비별/차종별/품목별 건수, 진행상태 분포)뿐이라 "지금 당장 확인할 것"에 답을 못 주던 문제 개선. ① ⚠️ 지연/미입고 카드: isScheduleDelayed 대상을 목록으로 바로 보여줌(도넛 차트 한 조각으로 뭉뚱그려지던 것을 개선). ② 📋 오늘 완료 처리 확인 카드: 오늘이 종료일인데 아직 완료 처리 안 된 항목. ③ 🔔 오늘의 메모 리마인드 카드(관리자 전용, 기존 activeReminders 재사용): 사이드패널에만 있던 리마인드를 대시보드에도 노출. ④ 🔧 오늘의 장비 가동현황: 장비별로 오늘 가동중/유휴 여부와 진행 중인 제목을 그리드로 표시. ⑤ 📅 향후 2주 장비별 가동률: 장비마다 앞으로 14일 중 일정이 잡힌 날의 비율을 막대로 표시(자동계획 수립 시 여유 장비 판단용). 이 섹션 전체는 좌측 사이드바의 그룹/장비/검색 필터는 반영하되, 대시보드 자체의 년도·월 필터와는 무관하게 항상 현재 시점 기준으로 동작(getDashboardBaseSchedules 재사용, getDashboardSchedules는 사용 안 함). 사용자 요청으로 '임박 항목 알림'은 이번 범위에서 제외.) (V1.52.0: 대시보드 대대적 재구성 — ① '향후 2주 장비별 가동률' 위젯 제거(불필요 판단). ② 기존 대시보드의 KPI 카드 4종(전체 계획건수/이번달 계획건수/변경건수/완료율)과 차트 6종(연도별/월별 추이/장비별/진행상태분포/차종별/품목별 계획건수), 그리고 이를 위한 년도·월 선택 필터를 전부 삭제(getDashboardSchedules/populateDashYearOptions/populateDashMonthOptions/isChangedSchedule 등 관련 함수도 함께 제거) — 대시보드가 이제 필터로 과거를 조회하는 화면이 아니라 '오늘'과 '이번달' 두 고정 시점만 보여주는 화면으로 성격이 바뀜. ③ 지연/미입고 카드가 상태값만 보고 과거에 지연이었던 건까지 다 끌고 오던 것을 수정 — 오늘이 그 일정의 날짜범위 안에 포함되는(오늘 또는 오늘까지 이어지는) 건만 보이도록 isDateInRange 조건 추가. ④ '오늘의 운영 현황'에 '오늘 기준 진행상태 분포' 도넛 차트 신규(오늘 날짜가 범위에 포함되는 일정만 집계). ⑤ '이번달 운영 현황' 섹션 신규 추가(연도·월 선택 없이 항상 이번 달로 고정) — 장비별 계획률(이번 달 근무일수 대비 계획일수 비율, 기존 isNonWorkDay로 주말·공휴일 판정), 진행상태 분포(이번 달 시작 일정 기준), 차종별 계획비율 TOP10(건수 대신 이번 달 전체 대비 %로 표시). 새 차트 canvas id(chart-status-today/chart-status-month/chart-vehicle-month)는 기존 renderDashChart/dashCharts 재사용.) (V1.53.0: ① 대시보드 '장비별 계획률'에서 70% 이상 찬 장비는 마우스 호버 시 이번 달 남아있는(계획 안 잡힌) 근무일 목록을 툴팁으로 보여줌. ② 🔒 마스터(업무현황 자동연동) 일정의 '결과 리뷰'/'변경 사유'가 실제로는 저장되지 않고 버려지던 버그 수정 — saveScheduleFromModal의 마스터 분기(updateMasterSchedule 호출 후 곧장 return)가 saveResultReview/logScheduleHistory 호출 지점보다 앞서 있어서 두 값 모두 애초에 저장 시도조차 안 되고 있었음. 마스터 분기 안에서 결과 리뷰 저장과, 원본 반영 성공 시 변경 이력(사유 포함) 기록을 직접 호출하도록 수정. 일정 상세 모달의 이력 섹션도 마스터 일정이라고 숨기던 것을 해제해 조회 가능하게 함(GAS 쪽 V1.28.0의 handleAddHistory 제한 해제와 함께 반영 필요 — 별도 GAS 파일 참고). ※ 결과 리뷰/이력은 앱 자체 저장소(Schedules/History 시트)에 저장되는 것이며, 원본 '시험계획표' 셀에는 반영되지 않음 — 그 시트엔 이런 자유 텍스트를 넣을 전용 칸이 없고, 기존 내용 칸에 억지로 끼워 넣으면 여러 기능이 의존하는 셀 내용 매칭(rawContent 비교)이 깨질 위험이 있어 시도하지 않음. 또한 마스터 일정 id(행 번호 기반)가 원본 재동기화로 나중에 바뀌면 이 저장분이 새 id와 연결되지 않아 다시 안 보이게 될 수 있는 제약이 남아있음(완전 해결하려면 내용 기반 안정 키로 재설계 필요, 별도 논의 필요).) (V1.54.0: ① 대시보드 진행상태 차트에서 '미입고'/'지연'/'검증지연' 색상을 회색·주황 계열에서 눈에 확 띄는 빨강(#ef4444)으로 통일(DASH_STATUS_COLORS, 테이블뷰 배지용 statusColors도 동일하게 변경). ② '이번달 운영 현황'에서 '장비별 계획률'을 최하단으로 재배치(진행상태 분포·차종별 계획비율이 먼저 나오고 그 아래로 이동, JS 렌더 순서는 변경 없이 HTML 배치만 이동).) (V1.55.0: 🔧 장비 고장/정비 등록 기능 추가(방향 A: 근태·결과리뷰와 같은 패턴으로 saveSchedule 재사용, GAS 변경 불필요) — 새 일정 등록 모달에서 실제 장비(휴일/이벤트 제외)를 고른 상태로 '신규' 모드일 때만 '🔧 장비 고장/정비 등록' 체크박스가 나타나며, 체크하고 저장하면 id에 'maint_' 접두어가 붙고(isMaintenanceRecord로 판별) 제목 앞에 🔧가 자동으로 붙는다. 실제 장비의 진짜 eqId를 그대로 쓰므로 캘린더·타임라인의 그 장비 행에 진한 회색(bg-slate-800) 막대로 나타나 "이 기간엔 이 장비를 못 쓴다"가 자연스럽게 보이고, 기존 진입 경로(캘린더 빈 칸 클릭 / 타임라인 해당 장비의 빈 칸 클릭)를 그대로 재사용해 별도 등록 화면을 새로 안 만듦. 시험이 아니므로 대시보드 통계(getDashboardBaseSchedules에서 제외), 진행상태 팝오버(canSetProgressStatus), 당기기/단축(isPullEligible), 밀어내기 후보 선택(populateReflowExistingSelect), 마스터 반영 중복 정리 비교 대상(findDuplicateAppSchedules)에서 모두 제외. 반대로 '오늘의 장비 가동현황'만은 예외로 getFilteredSchedules()를 직접 사용해 고장/정비 중인 장비를 '🔴 정비/고장중'으로 최우선 표시(진행 중인 시험보다 위에 노출).) -->

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family:'Pretendard', sans-serif; background:linear-gradient(135deg,#f8faff 0%,#eff2f9 100%); }
  .glass-card { background:rgba(255,255,255,.85); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.6); box-shadow:0 8px 32px rgba(31,38,135,.07); }
  .custom-scrollbar::-webkit-scrollbar{width:6px;height:6px;}
  .custom-scrollbar::-webkit-scrollbar-track{background:#f1f5f9;}
  .custom-scrollbar::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px;}
  /* 타임라인 뷰의 가로 스크롤바만 더 두껍게 (V1.26.0) — 세로 스크롤바 두께(width)는 건드리지 않음 */
  .timeline-hscroll::-webkit-scrollbar{height:16px;}
  .timeline-hscroll::-webkit-scrollbar-track{background:#f1f5f9;}
  .timeline-hscroll::-webkit-scrollbar-thumb{background:#94a3b8;border-radius:10px;border:3px solid #f1f5f9;background-clip:padding-box;}
  .timeline-hscroll::-webkit-scrollbar-thumb:hover{background:#64748b;}
  /* 브라우저 주소창/북마크바 등을 감안해 vh% 대신 "화면높이-고정여백" 방식으로 계산 (V1.12.0) */
  .view-scroll-area{max-height:calc(100vh - 300px); min-height:160px;}
  .calendar-day-box{min-height:110px;background:#fff;border-right:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;padding:6px;display:flex;flex-direction:column;gap:3px;}
  /* 모바일/태블릿 대응 (V1.26.1): 캘린더/스크롤영역/모달 등을 좁은 화면에 맞게 축소 */
  @media (max-width:1024px){
    .view-scroll-area{max-height:calc(100vh - 280px);}
  }
  @media (max-width:640px){
    .view-scroll-area{max-height:calc(100vh - 260px); min-height:140px;}
    .calendar-day-box{min-height:64px;padding:3px;gap:2px;}
    .calendar-item-chip{font-size:9px;padding:1px 4px;}
    .modal-overlay{padding:.5rem;}
    .tab-btn{padding:.5rem 1rem;font-size:.8rem;}
  }
  @media (max-width:400px){
    .calendar-day-box{min-height:52px;}
  }
  .calendar-day-box.is-today{background:#eef2ff;box-shadow:inset 0 0 0 2px #6366f1;position:relative;}
  .calendar-day-box.weekend-sun-shade{background:#fee2e2;}
  .calendar-day-box.weekend-sat-shade{background:#dbeafe;}
  .calendar-day-box.holiday-col-shade{background:#fca5a5;}
  .calendar-day-box.empty{background:#f8fafc;}
  .calendar-item-chip{font-size:10px;padding:2px 6px;border-radius:5px;color:#fff;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
  @keyframes syncSpin{to{transform:rotate(360deg)}}
  #btn-sync.syncing{animation:syncSpin 1s linear infinite;pointer-events:none;opacity:.7;}
  #loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.8);z-index:3000;display:none;flex-direction:column;align-items:center;justify-content:center;}
  .spinner{width:40px;height:40px;border:4px solid #f3f3f3;border-top:4px solid #6366f1;border-radius:50%;animation:spin 1s linear infinite;}
  @keyframes spin{100%{transform:rotate(360deg);}}
  .role-badge-admin{background:#eef2ff;color:#4f46e5;border:1px solid #c7d2fe;}
  .role-badge-editor{background:#ecfdf5;color:#059669;border:1px solid #a7f3d0;}
  .role-badge-viewer{background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0;}
  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:200;display:none;align-items:center;justify-content:center;padding:1rem;}
  /* 자동계획 수립 모달 전용: 배경을 어둡게 가리지 않고 화면 한쪽에 띄워, 뒤의 메인 화면(달력/타임라인)을 계속 조작할 수 있게 함 (V1.26.3) */
  .modal-overlay.modal-float{background:transparent;pointer-events:none;align-items:flex-end;justify-content:flex-end;}
  .modal-overlay.modal-float > .glass-card{pointer-events:auto;box-shadow:0 20px 60px -8px rgba(15,23,42,.35);max-height:calc(100vh - 2rem);overflow-y:auto;}
  @media (max-width:640px){
    .modal-overlay.modal-float{padding:0;justify-content:center;}
    .modal-overlay.modal-float > .glass-card{width:100%;max-width:100%;border-radius:24px 24px 0 0;max-height:72vh;}
  }
  /* V1.97.22: 메모/회의록 떠 있는 창 — 뒤 화면 조작 가능, 다른 창보다 아래 */
  #modal-memo, #modal-auto1, #modal-auto2{z-index:150;} /* V1.97.23: 자동계획 창도 다른 창보다 아래 */
  #modal-memo.modal-float > #memo-card{overflow:hidden;max-height:min(85vh, calc(100vh - 2rem));}
